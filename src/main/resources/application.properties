# 验证码有效期（分钟）
verify.code.expire-minutes=5

# ===== 交易配置 =====
# 是否启用审核阶段（false 时 MATCHED 直接跳转至 WAITING_DELIVERY）
# 校园以物换物场景默认不需要平台审核，双方同意即可进入发货阶段
trade.audit.enabled=false
# 审核模式：1=平台审核  2=双方互审
trade.audit.mode=1
# 发货超时小时数（WAITING_DELIVERY 超过此时限自动终止）
trade.timeout.delivery-hours=48
# 收货确认超时小时数（WAITING_CONFIRM_RECEIPT 超过此时限自动终止）
trade.timeout.receipt-hours=72

# ===== 日志 =====
logging.level.com.itcodai.campus_swap=debug

