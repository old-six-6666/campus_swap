spring.application.name=campus_swap
server.port=8080

# ===== 数据库 =====
spring.datasource.url=jdbc:mysql://localhost:3306/campus_swap?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=abc123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.itcodai.campus_swap.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ===== Elasticsearch =====
spring.elasticsearch.uris=http://localhost:9200

# ===== JWT =====
jwt.secret=campus_swap_secret_key_must_be_at_least_32_characters
jwt.expiration=86400000

# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads/
item.default-cover=/uploads/img.png

# ===== 邮件（请替换为你自己的邮箱和授权码）=====
